<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AI Game Studio</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#080b12;
    color:#fff;
}
button,input,textarea,select{
    font:inherit;
}
.app{
    min-height:100vh;
    display:flex;
    flex-direction:column;
}
header{
    height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    background:#0d111b;
    border-bottom:1px solid #202737;
}
.logo{
    font-size:20px;
    font-weight:800;
}
.logo span{color:#6c63ff}
.headerBtn{
    background:#6c63ff;
    color:white;
    border:0;
    border-radius:10px;
    padding:10px 15px;
    font-weight:700;
}
.layout{
    display:grid;
    grid-template-columns:300px 1fr 300px;
    min-height:calc(100vh - 64px);
}
.panel{
    background:#0d111b;
    border-right:1px solid #202737;
    padding:18px;
}
.right{
    border-right:0;
    border-left:1px solid #202737;
}
h2{
    margin:0 0 15px;
    font-size:18px;
}
label{
    display:block;
    color:#9ca6bb;
    font-size:13px;
    margin:15px 0 7px;
}
textarea,input,select{
    width:100%;
    background:#121824;
    color:#fff;
    border:1px solid #293246;
    border-radius:10px;
    padding:12px;
    outline:none;
}
textarea{
    min-height:110px;
    resize:vertical;
}
textarea:focus,input:focus,select:focus{
    border-color:#6c63ff;
}
.generate{
    width:100%;
    margin-top:12px;
    padding:13px;
    border:0;
    border-radius:10px;
    background:#6c63ff;
    color:white;
    font-weight:800;
}
.templates{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}
.template{
    padding:12px 8px;
    border-radius:10px;
    border:1px solid #293246;
    background:#121824;
    color:#fff;
}
.template:active{
    transform:scale(.97);
}
.editor{
    padding:18px;
    display:flex;
    flex-direction:column;
}
.toolbar{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:14px;
}
.tool{
    background:#121824;
    color:#fff;
    border:1px solid #293246;
    padding:9px 12px;
    border-radius:9px;
}
.tool.primary{
    background:#22c55e;
    border-color:#22c55e;
}
.preview{
    flex:1;
    min-height:500px;
    background:#05070b;
    border:1px solid #293246;
    border-radius:15px;
    overflow:hidden;
    position:relative;
}
#game{
    width:100%;
    height:100%;
    min-height:500px;
    display:block;
    touch-action:none;
}
.status{
    margin-top:10px;
    padding:10px;
    border-radius:9px;
    background:#101722;
    color:#9ca6bb;
    font-size:13px;
}
.stat{
    display:flex;
    justify-content:space-between;
    padding:11px 0;
    border-bottom:1px solid #202737;
}
.stat span:last-child{
    color:#6c63ff;
    font-weight:700;
}
.mobileControls{
    display:none;
    position:absolute;
    bottom:15px;
    left:15px;
    right:15px;
    justify-content:space-between;
    pointer-events:none;
}
.mobileControls button{
    pointer-events:auto;
    width:58px;
    height:58px;
    border:0;
    border-radius:50%;
    background:#ffffff22;
    color:white;
    font-size:24px;
}
@media(max-width:900px){
    .layout{
        display:block;
    }
    .panel{
        border:0;
        border-bottom:1px solid #202737;
    }
    .right{
        border:0;
        border-top:1px solid #202737;
    }
    .editor{
        min-height:600px;
    }
}
@media(max-width:600px){
    header{
        height:58px;
    }
    .logo{
        font-size:17px;
    }
    .headerBtn{
        padding:8px 10px;
    }
    .templates{
        grid-template-columns:1fr 1fr;
    }
    .preview,#game{
        min-height:430px;
    }
    .mobileControls{
        display:flex;
    }
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="logo">🎮 <span>AI</span> Game Studio</div>
    <button class="headerBtn" onclick="newProject()">＋ Новая игра</button>
</header>

<div class="layout">

<!-- LEFT -->
<aside class="panel">

<h2>🤖 Создатель игры</h2>

<label>Опиши свою игру</label>

<textarea id="prompt"
placeholder="Например: сделай игру, где игрок управляет машиной и собирает монеты..."></textarea>

<button class="generate" onclick="generateGame()">
✨ Создать игру
</button>

<label>Быстрый шаблон</label>

<div class="templates">

<button class="template" onclick="template('clicker')">
🖱️ Кликер
</button>

<button class="template" onclick="template('platformer')">
🏃 Платформер
</button>

<button class="template" onclick="template('racing')">
🏎️ Гонки
</button>

<button class="template" onclick="template('arena')">
⚔️ Арена
</button>

</div>

<label>Название</label>
<input id="gameName" value="Моя игра">

<label>Тип игры</label>
<select id="gameType">
<option value="clicker">Кликер</option>
<option value="platformer">Платформер</option>
<option value="racing">Гонки</option>
<option value="arena">Арена</option>
</select>

</aside>


<!-- CENTER -->
<main class="editor">

<div class="toolbar">

<button class="tool primary" onclick="runGame()">▶ Запустить</button>

<button class="tool" onclick="stopGame()">■ Стоп</button>

<button class="tool" onclick="resetGame()">↻ Сброс</button>

<button class="tool" onclick="saveProject()">💾 Сохранить</button>

<button class="tool" onclick="exportGame()">📦 Экспорт</button>

</div>

<div class="preview">

<canvas id="game"></canvas>

<div class="mobileControls">
<button id="left">←</button>
<button id="jump">↑</button>
<button id="right">→</button>
</div>

</div>

<div class="status" id="status">
Готово. Выберите шаблон или опишите игру.
</div>

</main>


<!-- RIGHT -->
<aside class="panel right">

<h2>📊 Параметры</h2>

<div class="stat">
<span>Монеты</span>
<span id="coins">0</span>
</div>

<div class="stat">
<span>Очки</span>
<span id="score">0</span>
</div>

<div class="stat">
<span>Уровень</span>
<span id="level">1</span>
</div>

<div class="stat">
<span>Жизни</span>
<span id="lives">3</span>
</div>

<label>Скорость игрока</label>
<input id="speed" type="range" min="1" max="10" value="5">

<label>Размер игрока</label>
<input id="size" type="range" min="15" max="60" value="30">

</aside>

</div>
</div>


<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=0,H=0;
let gameType="clicker";
let running=false;
let animation;
let coins=0;
let score=0;
let level=1;
let lives=3;

let player={
    x:100,
    y:200,
    vx:0,
    vy:0,
    size:30
};

let keys={};

function resize(){

    const r=canvas.getBoundingClientRect();

    W=Math.max(300,r.width);
    H=Math.max(400,r.height);

    canvas.width=W;
    canvas.height=H;
}

window.addEventListener("resize",resize);
resize();


function clear(){

    ctx.fillStyle="#081018";
    ctx.fillRect(0,0,W,H);
}


function drawText(text,x,y,size=20){

    ctx.fillStyle="#fff";
    ctx.font=`bold ${size}px Arial`;
    ctx.fillText(text,x,y);
}


function drawClicker(){

    clear();

    ctx.fillStyle="#111827";
    ctx.fillRect(0,0,W,H);

    drawText("КЛИКЕР",20,40,25);

    drawText("Монеты: "+coins,20,75,18);

    const cx=W/2;
    const cy=H/2;

    ctx.beginPath();
    ctx.arc(cx,cy,100,0,Math.PI*2);

    ctx.fillStyle="#6c63ff";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(cx,cy,82,0,Math.PI*2);

    ctx.fillStyle="#171c2b";
    ctx.fill();

    drawText("НАЖМИ",cx-43,cy+8,20);

    drawText("Нажимай на круг",cx-85,cy+150,16);
}


function drawPlatformer(){

    clear();

    ctx.fillStyle="#172554";
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle="#22c55e";
    ctx.fillRect(0,H-60,W,60);

    ctx.fillStyle="#38bdf8";
    ctx.fillRect(player.x,player.y,player.size,player.size);

    drawText("Уровень "+level,20,35,20);
    drawText("Очки: "+score,20,65,16);

    drawText("← → движение   ↑ прыжок",20,H-25,14);
}


function drawRacing(){

    clear();

    ctx.fillStyle="#151515";
    ctx.fillRect(W*.2,0,W*.6,H);

    ctx.strokeStyle="#fff";
    ctx.lineWidth=4;

    for(let y=0;y<H;y+=60){
        ctx.beginPath();
        ctx.moveTo(W/2,y);
        ctx.lineTo(W/2,y+30);
        ctx.stroke();
    }

    ctx.fillStyle="#ef4444";
    ctx.fillRect(W/2-25,H-110,50,80);

    drawText("🏎️ ГОНКИ",20,35,22);
    drawText("Очки: "+score,20,65,16);
}


function drawArena(){

    clear();

    ctx.fillStyle="#172033";
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle="#38bdf8";
    ctx.beginPath();
    ctx.arc(player.x,player.y,player.size,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#ef4444";
    ctx.beginPath();
    ctx.arc(W-100,150,28,0,Math.PI*2);
    ctx.fill();

    drawText("⚔️ АРЕНА",20,35,22);
    drawText("Жизни: "+lives,20,65,16);
}


function draw(){

    if(gameType==="clicker") drawClicker();
    if(gameType==="platformer") drawPlatformer();
    if(gameType==="racing") drawRacing();
    if(gameType==="arena") drawArena();
}


function runGame(){

    running=true;

    document.getElementById("status").textContent=
    "Игра запущена. Управление доступно на телефоне.";

    loop();
}


function loop(){

    if(!running)return;

    update();
    draw();

    animation=requestAnimationFrame(loop);
}


function update(){

    let speed=Number(document.getElementById("speed").value);

    player.size=Number(document.getElementById("size").value);

    if(gameType==="platformer"){

        if(keys.left)player.x-=speed;
        if(keys.right)player.x+=speed;

        player.vy+=0.5;
        player.y+=player.vy;

        if(player.y>H-60-player.size){
            player.y=H-60-player.size;
            player.vy=0;
        }

        if(player.x<0)player.x=0;

        if(player.x>W-player.size)
            player.x=W-player.size;
    }

    if(gameType==="arena"){

        if(keys.left)player.x-=speed;
        if(keys.right)player.x+=speed;
        if(keys.up)player.y-=speed;
        if(keys.down)player.y+=speed;

        player.x=Math.max(player.size,
            Math.min(W-player.size,player.x));

        player.y=Math.max(player.size,
            Math.min(H-player.size,player.y));
    }
}


function stopGame(){

    running=false;

    cancelAnimationFrame(animation);

    document.getElementById("status").textContent=
    "Игра остановлена.";

    draw();
}


function resetGame(){

    coins=0;
    score=0;
    level=1;
    lives=3;

    player.x=100;
    player.y=200;
    player.vy=0;

    updateStats();
    draw();

    document.getElementById("status").textContent=
    "Игра сброшена.";
}


function generateGame(){

    const text=document.getElementById("prompt").value.toLowerCase();

    if(text.includes("машин")||text.includes("гонк"))
        gameType="racing";

    else if(text.includes("платформ")||
            text.includes("прыж"))
        gameType="platformer";

    else if(text.includes("стрел")||
            text.includes("враг")||
            text.includes("арен"))
        gameType="arena";

    else
        gameType="clicker";

    document.getElementById("gameType").value=gameType;

    document.getElementById("status").textContent=
    "✨ Игра создана! Тип: "+gameType;

    resetGame();
}


function template(type){

    gameType=type;

    document.getElementById("gameType").value=type;

    const prompts={
        clicker:"Сделай кликер с монетами и улучшениями.",
        platformer:"Сделай платформер с персонажем, прыжком и уровнями.",
        racing:"Сделай гоночную игру с машиной и очками.",
        arena:"Сделай арену с игроком и врагами."
    };

    document.getElementById("prompt").value=prompts[type];

    document.getElementById("status").textContent=
    "Выбран шаблон: "+type;

    resetGame();
}


canvas.addEventListener("pointerdown",e=>{

    if(gameType==="clicker"){

        coins++;
        score+=10;

        if(coins%10===0)
            level++;

        updateStats();
        draw();
    }
});


function updateStats(){

    document.getElementById("coins").textContent=coins;
    document.getElementById("score").textContent=score;
    document.getElementById("level").textContent=level;
    document.getElementById("lives").textContent=lives;
}


document.addEventListener("keydown",e=>{

    if(e.key==="ArrowLeft")keys.left=true;
    if(e.key==="ArrowRight")keys.right=true;
    if(e.key==="ArrowUp")keys.up=true;
    if(e.key==="ArrowDown")keys.down=true;

    if(e.code==="Space" && gameType==="platformer"){
        if(player.vy===0)
            player.vy=-10;
    }
});


document.addEventListener("keyup",e=>{

    if(e.key==="ArrowLeft")keys.left=false;
    if(e.key==="ArrowRight")keys.right=false;
    if(e.key==="ArrowUp")keys.up=false;
    if(e.key==="ArrowDown")keys.down=false;
});


function control(id,key){

    const b=document.getElementById(id);

    b.addEventListener("pointerdown",()=>{
        keys[key]=true;

        if(key==="up" && gameType==="platformer"){
            if(player.vy===0)
                player.vy=-10;
        }
    });

    b.addEventListener("pointerup",()=>{
        keys[key]=false;
    });

    b.addEventListener("pointercancel",()=>{
        keys[key]=false;
    });
}

control("left","left");
control("right","right");
control("jump","up");


function saveProject(){

    const project={
        name:document.getElementById("gameName").value,
        type:gameType,
        prompt:document.getElementById("prompt").value
    };

    localStorage.setItem(
        "ai_game_studio_project",
        JSON.stringify(project)
    );

    document.getElementById("status").textContent=
    "💾 Проект сохранён на устройстве.";
}


function loadProject(){

    const data=localStorage.getItem(
        "ai_game_studio_project"
    );

    if(!data)return;

    const project=JSON.parse(data);

    document.getElementById("gameName").value=project.name;
    document.getElementById("prompt").value=project.prompt;

    gameType=project.type;

    document.getElementById("gameType").value=gameType;
}


function exportGame(){

    const html=`<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${document.getElementById("gameName").value}</title>
<style>
body{margin:0;background:#080b12;color:white;font-family:Arial;text-align:center}
canvas{width:100%;height:80vh;background:#101827}
</style>
</head>
<body>
<h2>${document.getElementById("gameName").value}</h2>
<canvas id="game"></canvas>
<script>
const c=document.getElementById("game");
const x=c.getContext("2d");

function resize(){
c.width=innerWidth;
c.height=innerHeight*0.8;
}
resize();
addEventListener("resize",resize);

let coins=0;

c.addEventListener("pointerdown",()=>{
coins++;
draw();
});

function draw(){
x.fillStyle="#111827";
x.fillRect(0,0,c.width,c.height);

x.fillStyle="#6c63ff";
x.beginPath();
x.arc(c.width/2,c.height/2,100,0,Math.PI*2);
x.fill();

x.fillStyle="white";
x.font="24px Arial";
x.textAlign="center";
x.fillText("НАЖМИ",c.width/2,c.height/2);

x.font="18px Arial";
x.fillText("Монеты: "+coins,c.width/2,50);
}

draw();
<\/script>
</body>
</html>`;

    const blob=new Blob([html],{type:"text/html"});
    const url=URL.createObjectURL(blob);

    const a=document.createElement("a");
    a.href=url;
    a.download="my-game.html";
    a.click();

    URL.revokeObjectURL(url);

    document.getElementById("status").textContent=
    "📦 Игра экспортирована.";
}


function newProject(){

    document.getElementById("gameName").value="Моя новая игра";
    document.getElementById("prompt").value="";

    resetGame();

    document.getElementById("status").textContent=
    "Создан новый проект.";
}


document.getElementById("gameType").addEventListener("change",e=>{

    gameType=e.target.value;
    resetGame();

});


loadProject();
updateStats();
draw();

</script>

</body>
</html>
