<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a0f"><title>AI Game Studio 4.5</title><link rel="stylesheet" href="styles.css"></head><body><main class="app"><header><div><div class="brand">AI GAME STUDIO <span>4.5</span></div><div class="muted">Создание игр с телефона</div></div><div id="status" class="status">● offline</div></header><section id="auth" class="card"><h1>Твоя игровая студия</h1><p>Создавай проекты, храни их отдельно и запускай полный AI-пайплайн.</p><input id="name" placeholder="Имя создателя"><button id="enter">Войти в студию</button></section><section id="studio" class="hidden"><div class="top"><div><div class="muted">Аккаунт</div><b id="userName">—</b><small id="userId">—</small></div><button id="newProject" class="secondary">＋ Новый проект</button></div><div class="grid"><section class="card"><h2>Мои проекты</h2><div id="projects"></div></section><section class="card" id="workspace"><div class="muted">Выбери проект</div><h2 id="projectTitle">AI Game Studio</h2><div id="projectMeta" class="muted">—</div><textarea id="idea" placeholder="Например: реалистичная survival-игра от первого лица на заброшенной полярной станции..."></textarea><div class="actions"><button id="create">Создать проект</button><button id="generate" class="secondary" disabled>AI Blueprint</button><button id="build" disabled>Собрать игру</button></div><div id="stages"></div><div id="result" class="result hidden"></div></section></div></section></main><script src="app.js"></script></body></html>
