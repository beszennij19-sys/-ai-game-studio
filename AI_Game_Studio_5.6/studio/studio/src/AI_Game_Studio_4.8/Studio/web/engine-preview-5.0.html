<!doctype html><html lang="ru"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Game Studio 5.0</title>
<style>body{margin:0;background:#10131a;color:#fff;font:16px system-ui}main{max-width:900px;margin:auto;padding:18px}.card{background:#191e28;border-radius:16px;padding:18px;margin:12px 0}button{padding:13px 16px;border:0;border-radius:12px;margin:5px;font-weight:700}#log{white-space:pre-wrap;min-height:160px}</style>
<main><h1>🎮 AI Game Studio 5.0</h1><div class=card><b id=project>PROJECT-DEMO</b><div>❤️ HP: <span id=hp>100</span>　🪙 Монеты: <span id=coins>0</span>　📍 <span id=loc>start</span></div></div><div class=card><button onclick="damage()">⚔️ Получить урон</button><button onclick="heal()">❤️ Лечение</button><button onclick="loot()">📦 Лут</button><button onclick="quest()">📜 Квест</button><button onclick="eventx()">⚡ Событие</button></div><div class=card id=log>Движок 5.0 готов.</div></main>
<script type=module>
import {AIGameEngine50} from '../engine-5.0/ai-game-engine-5.0.js'; const e=new AIGameEngine50('PROJECT-DEMO'); const log=t=>{document.querySelector('#log').textContent=t; render()}; window.damage=()=>log('Враг атаковал. HP: '+e.damage(15)); window.heal=()=>log('Игрок восстановил здоровье. HP: '+e.heal(10)); window.loot=()=>{e.reward(25,'resource');log('Получен лут: +25 монет и resource')}; window.quest=()=>{e.progressQuest('survive',1);log('Прогресс квеста survive: '+e.state.quests.survive.progress)}; window.eventx=()=>{e.triggerEvent('world_event');log('Событие мира активировано')}; function render(){hp.textContent=e.state.hp;coins.textContent=e.state.coins;loc.textContent=e.state.location}
</script></html>
