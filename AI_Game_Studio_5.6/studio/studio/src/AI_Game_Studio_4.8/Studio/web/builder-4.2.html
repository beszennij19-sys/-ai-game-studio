<!doctype html><html lang="ru"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Game Studio 4.2</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:#0b0d10;color:#fff;margin:0;padding:20px}main{max-width:760px;margin:auto}textarea,input,button{width:100%;box-sizing:border-box;border-radius:14px;padding:14px;margin:8px 0;font-size:16px}textarea{height:150px}button{background:#fff;color:#111;border:0;font-weight:700}.card{background:#151920;border:1px solid #2a3039;border-radius:18px;padding:16px;margin:12px 0}.ok{font-size:18px}</style><main><h1>AI Game Studio 4.2</h1><p>Одна команда: идея → Blueprint → мир → персонажи → квесты → ассеты → Runtime → Director → Unity Export.</p><div class=card><input id=id placeholder="Project ID"><textarea id=idea placeholder="Опиши игру..."></textarea><button id=build>Собрать полный проект</button></div><div id=out class=card>Готов к сборке.</div><script>
const out=document.querySelector('#out');document.querySelector('#build').onclick=async()=>{const projectId=document.querySelector('#id').value.trim();const idea=document.querySelector('#idea').value.trim();if(!projectId||!idea){out.textContent='Укажи Project ID и описание игры.';return}out.textContent='Сборка запущена...';const r=await fetch('/api/projects/'+encodeURIComponent(projectId)+'/build',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({idea})});const j=await r.json();out.innerHTML='<div class=ok>Статус: '+(j.status||'accepted')+'</div><pre>'+JSON.stringify(j,null,2)+'</pre>';};
</script></main></html>
