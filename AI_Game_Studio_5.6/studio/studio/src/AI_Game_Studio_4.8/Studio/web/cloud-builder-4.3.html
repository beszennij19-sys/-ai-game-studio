<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI Game Studio 4.3</title><style>body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:#080a0d;color:#fff;margin:0;padding:18px}main{max-width:760px;margin:auto}.card{background:#14171c;border:1px solid #2a3038;border-radius:18px;padding:16px;margin:12px 0}textarea,input{width:100%;box-sizing:border-box;background:#0c0f13;color:#fff;border:1px solid #363d47;border-radius:12px;padding:13px;font-size:16px}textarea{height:130px}button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:12px;font-weight:700;font-size:16px}.stage{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #292e36}.muted{color:#a5aab3}pre{white-space:pre-wrap;overflow:auto}</style></head><body><main><div class=card><h1>AI Game Studio 4.3</h1><p class=muted>Облачная сборка: проект → Unity export → CI workflow → build artifacts.</p></div><div class=card><input id=id placeholder="Project ID"><textarea id=idea placeholder="Описание игры"></textarea><button id=go>Подготовить Cloud Build</button><p id=status class=muted></p></div><div class=card><h2>Этапы</h2><div id=stages>Ожидание…</div></div><div class=card><pre id=json></pre></div></main><script>
const out=document.querySelector('#json'), stages=document.querySelector('#stages');
document.querySelector('#go').onclick=async()=>{const id=document.querySelector('#id').value.trim(),idea=document.querySelector('#idea').value.trim();if(!id){document.querySelector('#status').textContent='Укажи Project ID';return}document.querySelector('#status').textContent='Подготавливаю облачную сборку…';const r=await fetch('/api/projects/'+encodeURIComponent(id)+'/cloud-build',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({targets:['WebGL','Android','iOS','Windows']})});const j=await r.json();if(j.error){document.querySelector('#status').textContent='Ошибка: '+j.error;return}stages.innerHTML=(j.stages||[]).map(s=>'<div class=stage><span>'+s.name+'</span><b>'+s.status+'</b></div>').join('');document.querySelector('#status').textContent=j.dispatch==='configured'?'CI настроен для удалённого запуска.':'Workflow подготовлен; GitHub/Unity credentials ещё не настроены.';out.textContent=JSON.stringify(j,null,2)};
</script></body></html>
