services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aigamestudio}
      POSTGRES_USER: ${POSTGRES_USER:-aigame}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - aigame-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
  studio:
    build:
      context: ../..
      dockerfile: Studio/deploy/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8787
      DATABASE_URL: postgresql://${POSTGRES_USER:-aigame}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aigamestudio}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-5.6-sol}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${DOMAIN}}
    volumes:
      - aigame-generated:/app/Studio/generated
      - aigame-data:/app/Studio/data
    expose: ["8787"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
  worker:
    build:
      context: ../..
      dockerfile: Studio/deploy/Dockerfile
    restart: unless-stopped
    command: ["node","Studio/worker/worker-4.6.mjs"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-aigame}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aigamestudio}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-5.6-sol}
    volumes:
      - aigame-generated:/app/Studio/generated
      - aigame-data:/app/Studio/data
    depends_on:
      db:
        condition: service_healthy
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      studio:
        condition: service_healthy
volumes:
  aigame-db:
  aigame-generated:
  aigame-data:
  caddy-data:
  caddy-config:
