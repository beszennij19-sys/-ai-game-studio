services:
  web:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./../../:/app"]
    command: ["node", "studio/launch-5.1/server-5.1.mjs"]
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://aigame:${POSTGRES_PASSWORD:-change-me}@db:5432/aigame"
    depends_on: [db]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aigame
      POSTGRES_USER: aigame
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: ["aigame_data:/var/lib/postgresql/data"]
volumes:
  aigame_data:
