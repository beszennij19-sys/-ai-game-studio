<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><title>AI Game Studio 5.2</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0b1020;color:#fff}main{max-width:820px;margin:auto;padding:24px 16px}.card{background:#151c31;border:1px solid #2b3554;border-radius:20px;padding:18px;margin:12px 0}textarea{width:100%;box-sizing:border-box;min-height:150px;border-radius:14px;padding:14px;background:#0d1426;color:#fff;border:1px solid #34405f;font-size:16px}button{width:100%;padding:15px;border:0;border-radius:14px;font-size:16px;font-weight:700;margin-top:10px}.steps{display:grid;gap:8px}.step{padding:10px 12px;border-radius:10px;background:#0d1426}.muted{color:#9aa6c1}.ready{margin-top:12px;padding:12px;border-radius:12px;background:#16253a}</style></head><body><main><h1>🎮 AI Game Studio</h1><p class="muted">5.2 — единый запуск генерации игры</p><div class="card"><h2>Создать игру</h2><textarea id="idea" placeholder="Опиши игру: жанр, мир, героя, цель, механики..."></textarea><button id="create">Создать проект</button><button id="ai" disabled>🤖 Создать Blueprint через AI</button><button id="build" disabled>🚀 Собрать игру</button></div><div class="card"><h2>Прогресс</h2><div id="steps" class="steps"></div><div id="result"></div></div></main><script>let project=null;const steps=['Project','Blueprint','Gameplay','World','Characters','Quests','Assets','Gameplay World','Runtime','Director','Unity Export','Validation'];const el=id=>document.getElementById(id);function render(active=-1){el('steps').innerHTML=steps.map((s,i)=>`<div class="step">${i<=active?'✅':'○'} ${i+1}. ${s}</div>`).join('')}render();el('create').onclick=async()=>{const idea=el('idea').value.trim();if(!idea)return;const r=await fetch('/api/projects',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({idea})});project=await r.json();el('result').innerHTML=`<div class="ready">Проект: <b>${project.projectId}</b></div>`;el('ai').disabled=false;el('build').disabled=false};el('ai').onclick=async()=>{if(!project)return;el('result').textContent='AI создаёт Blueprint…';const r=await fetch('/api/projects/'+project.projectId+'/blueprint',{method:'POST'});const d=await r.json();if(d.blueprint){project.blueprint=d.blueprint;el('result').innerHTML=`<div class="ready">🤖 Blueprint готов: <b>${d.blueprint.title}</b><br><small>${d.blueprint.genre} · ${d.blueprint.camera} · ${d.blueprint.playerMode}</small></div>`}else el('result').textContent=d.error||'Ошибка AI'};el('build').onclick=async()=>{if(!project)return;render(0);el('result').textContent='Собираем…';const r=await fetch('/api/projects/'+project.projectId+'/build',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({blueprint:project.blueprint})});const d=await r.json();if(d.status==='completed'){render(11);el('result').innerHTML=`<div class="ready">✅ Игра подготовлена<br>Build: <b>${d.buildId}</b><br><small>Preview: ${d.preview.path}</small></div>`}else el('result').textContent=d.error||'Ошибка сборки'};</script></body></html>
