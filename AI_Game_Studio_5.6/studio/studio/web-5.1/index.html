<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>AI Game Studio</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0b1020;color:#fff}main{max-width:760px;margin:auto;padding:28px 18px}.card{background:#151c31;border:1px solid #2b3554;border-radius:20px;padding:20px;margin:14px 0}button{width:100%;padding:15px;border:0;border-radius:14px;font-size:16px;font-weight:700}textarea{width:100%;box-sizing:border-box;min-height:140px;border-radius:14px;padding:14px;background:#0d1426;color:#fff;border:1px solid #34405f}small{color:#9aa6c1}.status{display:none}</style></head><body><main><h1>🎮 AI Game Studio</h1><p><small>Создай игру из одной идеи.</small></p><div class="card"><h2>Новая игра</h2><textarea id="idea" placeholder="Например: survival от первого лица на заброшенной полярной станции..."></textarea><br><br><button id="create">Создать игру</button></div><div class="card status" id="status"></div></main><script>const s=document.getElementById('status');document.getElementById('create').onclick=async()=>{const idea=document.getElementById('idea').value.trim();if(!idea)return; s.style.display='block';s.textContent='Создаём проект…';try{const r=await fetch('/api/launch/projects',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({idea})});const d=await r.json();s.textContent=d.projectId?`Проект создан: ${d.projectId}`:(d.error||'Ошибка');}catch(e){s.textContent='Сайт запущен, но API пока не подключён.'}};</script></body></html>
