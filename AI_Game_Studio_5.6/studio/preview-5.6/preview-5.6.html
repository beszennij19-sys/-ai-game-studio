<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI Game Studio — 5.6 Preview</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#111;color:#fff;font-family:system-ui}canvas{display:block;width:100%;height:100%}.hud{position:fixed;inset:0;pointer-events:none}.bar{margin:12px;padding:10px 12px;background:#0009;border:1px solid #ffffff22;border-radius:12px;width:max-content}.cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px}.controls{position:absolute;bottom:20px;left:20px;display:flex;gap:10px;pointer-events:auto}.btn{width:62px;height:62px;border-radius:50%;border:1px solid #fff4;background:#0008;color:#fff;font-size:22px}.right{left:auto;right:20px}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="bar" id="stats">Loading preview…</div><div class="cross">+</div><div class="controls"><button class="btn" data-k="KeyW">↑</button><button class="btn" data-k="KeyA">←</button><button class="btn" data-k="KeyS">↓</button><button class="btn" data-k="KeyD">→</button></div><div class="controls right"><button class="btn" id="act">●</button></div></div><script type="module">import {build3DPreview} from './ai-3d-preview-5.6.js';
const c=document.querySelector('#c'),x=c.getContext('2d'); let dpr=devicePixelRatio||1,W,H;function resize(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const bp=JSON.parse(localStorage.getItem('aigame_blueprint_5_6')||'{}');const p=build3DPreview(bp);let px=0,py=0,hp=100,coins=0;const keys=new Set();addEventListener('keydown',e=>keys.add(e.code));addEventListener('keyup',e=>keys.delete(e.code));document.querySelectorAll('[data-k]').forEach(b=>{b.onpointerdown=()=>keys.add(b.dataset.k);b.onpointerup=()=>keys.delete(b.dataset.k);b.onpointerleave=()=>keys.delete(b.dataset.k)});document.querySelector('#act').onclick=()=>{coins+=p.mechanics.combat?10:1};
function frame(){let s=3;if(keys.has('KeyW'))py-=s;if(keys.has('KeyS'))py+=s;if(keys.has('KeyA'))px-=s;if(keys.has('KeyD'))px+=s;px=Math.max(-300,Math.min(300,px));py=Math.max(-220,Math.min(220,py));x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#182333');g.addColorStop(1,'#27351f');x.fillStyle=g;x.fillRect(0,0,W,H);x.save();x.translate(W/2-px,H/2-py);x.strokeStyle='#ffffff22';for(let i=-800;i<=800;i+=50){x.beginPath();x.moveTo(i,-600);x.lineTo(i,600);x.stroke();x.beginPath();x.moveTo(-900,i);x.lineTo(900,i);x.stroke()}x.fillStyle='#6b5138';for(let i=0;i<8;i++){let rx=(i*173)%700-350,ry=(i*97)%500-250;x.fillRect(rx,ry,45,45)}x.fillStyle='#d5d5d5';x.beginPath();x.arc(0,0,18,0,7);x.fill();if(p.entities.enemies){x.fillStyle='#b34';for(let i=0;i<p.entities.enemies;i++){let ex=i*130-130,ey=-100+i*70;x.beginPath();x.arc(ex,ey,18,0,7);x.fill()}}x.restore();document.querySelector('#stats').textContent=`HP ${hp}  •  ◇ ${coins}  •  ${p.camera}  •  ${Object.entries(p.mechanics).filter(([,v])=>v).map(([k])=>k).join(', ')||'exploration'}`;requestAnimationFrame(frame)}frame();</script></body></html>
