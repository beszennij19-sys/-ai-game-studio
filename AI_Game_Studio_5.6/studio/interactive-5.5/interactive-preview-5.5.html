<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI Game Studio 5.5 Preview</title><style>html,body{margin:0;height:100%;background:#111;color:#fff;font:16px system-ui}#game{height:100%;display:flex;flex-direction:column}#hud{padding:12px;display:flex;gap:10px;flex-wrap:wrap;background:#181818}#scene{position:relative;flex:1;overflow:hidden;background:linear-gradient(#18252e,#31452f)}#player{position:absolute;left:50%;top:50%;width:34px;height:34px;border-radius:50%;background:#fff;transform:translate(-50%,-50%)}.enemy{position:absolute;width:30px;height:30px;background:#c44;border-radius:8px}.item{position:absolute;width:22px;height:22px;background:#dbb;border-radius:4px}.controls{padding:12px;display:flex;gap:10px;background:#181818;justify-content:center}.controls button{min-width:80px;min-height:48px;border:0;border-radius:12px;font-size:16px}</style><div id="game"><div id="hud"><span id="hp"></span><span id="coins"></span><span id="inv"></span><span id="quest"></span></div><div id="scene"><div id="player"></div><div class="enemy" style="left:25%;top:35%"></div><div class="item" style="left:70%;top:60%"></div></div><div class="controls"><button data-a="left">←</button><button data-a="forward">↑</button><button data-a="back">↓</button><button data-a="right">→</button><button data-a="attack">⚔️</button><button data-a="collect">📦</button></div></div><script type="module">import{InteractiveGameRuntime55}from'./interactive-runtime-5.5.js';const r=new InteractiveGameRuntime55({combat:{damage:25},hunger:{enabled:true,drainPerSecond:.2}});r.startQuest('intro');let p={x:50,y:50};const ui=()=>{hp.textContent=`❤️ ${r.state.hp}/${r.state.maxHp}`;coins.textContent=`🪙 ${r.state.coins}`;inv.textContent=`🎒 ${r.state.inventory.length}`;quest.textContent=`📜 ${r.state.quests.intro?.progress||0}/3`};const draw=()=>{player.style.left=p.x+'%';player.style.top=p.y+'%';ui()};document.querySelectorAll('button').forEach(b=>b.onclick=()=>{let a=b.dataset.a;if(a==='left')p.x-=3;if(a==='right')p.x+=3;if(a==='forward')p.y-=3;if(a==='back')p.y+=3;if(a==='attack')r.attack({id:'enemy-1',hp:50,reward:10,loot:'resource'});if(a==='collect'){r.collect('resource');r.progressQuest('intro');}draw()});draw();setInterval(()=>{r.tick(1);ui()},1000);</script></html>
