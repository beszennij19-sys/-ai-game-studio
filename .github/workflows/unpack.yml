name: Unpack game

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack ZIP
        run: |
          mkdir -p extracted
          unzip -o AI_Game_Studio_5.8_Release_Candidate_iPhone.zip -d extracted

      - name: Move project files
        run: |
          cp -R extracted/* ./
          rm -rf extracted
          rm -f AI_Game_Studio_5.8_Release_Candidate_iPhone.zip

      - name: Commit unpacked project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Unpack game project" || echo "Nothing to commit"
          git push
